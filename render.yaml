services:
  - type: web
    name: reelwright-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: VIDEO_PROVIDER
        value: hf_space
      # HF_SPACES is optional: when unset, the free defaults (Lightricks/ltx-video-distilled, Wan-AI/Wan2.1) are used.
      - key: HF_TOKEN             # free HF token (raises daily free-GPU quota). Secret: Render dashboard only, never git
        sync: false
      - key: HF_PARALLEL
        value: "1"
      - key: MAX_QUEUE
        value: "3"
      - key: STORYBOARD_ENGINE
        value: rules
      - key: NARRATION_ENGINE
        value: espeak
